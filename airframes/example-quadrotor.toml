# An example quadrotor for the airframe format's documentation (#18). Its numbers are
# illustrative, as its only source says. Real airframes, with every value cited, arrive with
# #29 (Bitcraze Crazyflie 2.x) and #30 (Holybro X500 V2).
#
# Body axes are FRD: x forward, y right, z down. Every number is a table with its unit and its
# source; `mjk airframe airframes/example-quadrotor.toml` prints the page the book shows.
schema_version = 1
kind = "airframe"
name = "Example quadrotor"

[sources.illustrative]
title = "Illustrative values for the airframe format's documentation"
note = "Not a real aircraft. Real airframes, with every value cited, arrive with #29 and #30."

# Mass properties, built up from parts: a 450 mm frame with 10-inch propellers.
[[mass.components]]
name = "center plates"
mass = { value = 250, unit = "g", source = "illustrative" }
position = { value = [0, 0, 0], unit = "mm", source = "illustrative" }
shape = "box"
size = { value = [120, 120, 30], unit = "mm", source = "illustrative" }

[[mass.components]]
name = "battery"
mass = { value = 350, unit = "g", source = "illustrative", uncertainty = 5 }
position = { value = [0, 0, 35], unit = "mm", source = "illustrative" }
shape = "box"
size = { value = [140, 45, 35], unit = "mm", source = "illustrative" }

[[mass.components]]
name = "flight controller and receiver"
mass = { value = 100, unit = "g", source = "illustrative" }
position = { value = [0, 0, -25], unit = "mm", source = "illustrative" }
shape = "point"

[[mass.components]]
