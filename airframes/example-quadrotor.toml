# Rotors: PX4's quadrotor X numbering and spin directions, thrust up.

[[rotors]]
name = "front right"
position = { value = [159.1, 159.1, -35], unit = "mm", source = "illustrative" }
axis = { value = [0, 0, -1], unit = "1", source = "illustrative" }
spin = "ccw"
propeller = "10x4.5"
motor = "2212-920"
esc = "20a"

[[rotors]]
name = "rear left"
position = { value = [-159.1, -159.1, -35], unit = "mm", source = "illustrative" }
axis = { value = [0, 0, -1], unit = "1", source = "illustrative" }
spin = "ccw"
propeller = "10x4.5"
motor = "2212-920"
esc = "20a"

[[rotors]]
name = "front left"
position = { value = [159.1, -159.1, -35], unit = "mm", source = "illustrative" }
axis = { value = [0, 0, -1], unit = "1", source = "illustrative" }
spin = "cw"
propeller = "10x4.5"
motor = "2212-920"
esc = "20a"

[[rotors]]
name = "rear right"
position = { value = [-159.1, 159.1, -35], unit = "mm", source = "illustrative" }
axis = { value = [0, 0, -1], unit = "1", source = "illustrative" }
spin = "cw"
propeller = "10x4.5"
motor = "2212-920"
esc = "20a"

[propellers."10x4.5"]
diameter = { value = 10, unit = "in", source = "illustrative" }
pitch = { value = 4.5, unit = "in", source = "illustrative" }
blades = { value = 2, unit = "1", source = "illustrative" }
max_thrust = { value = 1000, unit = "gf", source = "illustrative", uncertainty = 50 }
mass = { value = 12, unit = "g", source = "illustrative" }
inertia = { value = 645, unit = "g cm^2", source = "illustrative" }
data = "illustrative; measured propellers cite a dataset such as the UIUC propeller database"

[motors."2212-920"]
kv = { value = 920, unit = "rpm/V", source = "illustrative" }
resistance = { value = 117, unit = "mohm", source = "illustrative" }
no_load_current = { value = 0.4, unit = "A", source = "illustrative" }
max_current = { value = 15, unit = "A", source = "illustrative" }
inertia = { value = 200, unit = "g cm^2", source = "illustrative" }
mass = { value = 55, unit = "g", source = "illustrative" }

[escs.20a]
latency = { value = 2, unit = "ms", source = "illustrative" }
slew_rate = { value = 40, unit = "1/s", source = "illustrative" }
braking = "active"
max_current = { value = 20, unit = "A", source = "illustrative" }

[battery]
cells = { value = 3, unit = "1", source = "illustrative" }
capacity = { value = 3000, unit = "mAh", source = "illustrative" }
internal_resistance = { value = 30, unit = "mohm", source = "illustrative" }

# Drag coefficient times reference area, along each body axis.
[drag]
area = { value = [120, 120, 300], unit = "cm^2", source = "illustrative" }

[controller]
kind = "cascaded-pid"
gains.roll_rate_p = { value = 0.15, unit = "N m s/rad", source = "illustrative" }
gains.attitude_p = { value = 6.5, unit = "1/s", source = "illustrative" }
gains.velocity_p = { value = 1.8, unit = "1/s", source = "illustrative" }

[visual]
body_size = { value = [120, 120, 40], unit = "mm", source = "illustrative" }
arm_width = { value = 20, unit = "mm", source = "illustrative" }
color = "#2f6fde"
