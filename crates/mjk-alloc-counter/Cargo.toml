[package]
name = "mjk-alloc-counter"
description = "A counting global allocator for tests; the one crate allowed to contain unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The workspace lints, with one change: `unsafe_code` is "deny" here rather than "forbid", so the
# single `unsafe impl GlobalAlloc` can be allowed where it is written. Cargo cannot override one
# workspace lint, so the table is repeated; keep it in step with the workspace Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panicking shortcuts outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Numerics: no exact float comparison, no silent `as` casts.
float_cmp = "deny"
float_cmp_const = "deny"
as_conversions = "deny"
# Hygiene.
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
rc_mutex = "deny"
# Power of Ten (#88). Rule 1: shallow nesting (threshold in clippy.toml).
excessive_nesting = "deny"
# Rule 2: no loop without an exit.
infinite_loop = "deny"
# Rule 6: a name means one thing within its scope.
shadow_unrelated = "deny"
# Rule 7: never discard a result that must be used, or an untyped value.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
# Every unsafe block states why it is sound.
undocumented_unsafe_blocks = "deny"
