# cargo-mutants configuration (#88). CI runs mutation testing on the lines each change touches
# and fails on any mutant that survives; a weekly job mutates the whole engine
# (CONTRIBUTING.md, "Mutation testing").

# Engine crates only: xtask is repository tooling, the CLI and WebAssembly crates are thin front
# ends covered by their own smoke tests, and the allocation counter is test support.
exclude_globs = [
    "xtask/**",
    "crates/mjk-cli/**",
    "crates/mjk-wasm/**",
    "crates/mjk-alloc-counter/**",
]

# Equivalent mutants: changes no test can observe, because both versions compute the same
# result for every input. Each entry names the file and function, never a line number, and says
# why the two versions agree. Adding one is a reviewed change to this file.
exclude_re = [
    # Switching between a Taylor series and the closed form at `<` or `<=` the switch point:
    # at the switch point both branches are accurate to rounding (docs: SO(3) maps).
    'so3\.rs:.*replace < with <= in half_sine_over_angle$',
    'so3\.rs:.*replace < with <= in jacobian_coefficients$',
    'so3\.rs:.*replace < with <= in inverse_jacobian_coefficient$',
    # In `log`: at w = 0 exactly (a half turn) q and −q give opposite rotation vectors of length
    # π, both correct; and at the small-norm switch point both branches agree to rounding.
    'so3\.rs:.*replace < with <= in UnitQuat::log$',
    # The determinant of a matrix that passed the orthonormality check is ±1, never 0.
    'so3\.rs:.*replace > with >= in Rotation<To, From>::from_matrix$',
    # Shepperd's method is exact from any of several equal largest candidates.
    'so3\.rs:.*replace > with >= in shepperd$',
    # At cos(pitch) exactly equal to the gimbal-lock threshold both formulas give the same angles.
    'euler\.rs:.*replace < with <= in Rotation<To, From>::to_euler$',
    # The triple product of an orthonormal basis is ±1, never 0.
    'eigen\.rs:.*replace < with <= in sorted$',
    # Not strictly equivalent: `<` and `<=` differ for a minor exactly equal to minus its
    # allowance. Which side of that boundary is rejected is a tolerance convention, not physics;
    # the tests pin the tolerance at three times and at one times its value instead.
    'mass\.rs:.*replace < with <= in check_realizable$',
    # `root()` is defined as `Self::default()`.
    'field_path\.rs:.*replace FieldPath::root -> Self with Default::default\(\)$',
    # The integrator study's body is torque-free and autonomous: its load model returns the
    # default (zero) loads, and the time passed to each step cannot change any result.
    'validation/integrators\.rs:.*replace <impl LoadModel for TorqueFree>::loads -> Loads with Default::default\(\)$',
    'validation/integrators\.rs:.*replace \* with [+/] in integrate$',
    # The analytic suite's torque-free body is the same: its loads are the default (zero) loads.
    'analytic/bodies\.rs:.*replace <impl LoadModel for TorqueFree>::loads -> Loads with Default::default\(\)$',
    # Not strictly equivalent: `>` and `>=` differ only for rotor axes whose cross product is
    # exactly the parallel tolerance, 1e-6, which no test can construct from normalized axes.
    # Which side of that boundary counts as tilted is a tolerance convention, as in mass.rs above.
    'plausibility\.rs:.*replace > with >= in tilted$',
    # A motor speed's position-like part is the zero speed, which is the default.
    'propulsion/system\.rs:.*replace <impl Coordinates for MotorSpeed>::positions -> Self with Default::default\(\)$',
    # At rest, a net rate of exactly zero gives zero acceleration either way.
    'propulsion/motor\.rs:.*replace < with <= in DcMotor::acceleration$',
]

# Release-like timing is unnecessary; tests are fast, so a mutant that makes one loop forever
# is cut off quickly.
timeout_multiplier = 3.0
