# Panicking shortcuts are acceptable inside tests, where a panic is a test failure.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Power of Ten rule 4 and the strict-code-standards hard cap: at most 50 lines per function.
too-many-lines-threshold = 50

# Power of Ten rule 1: at most 3 levels of nesting inside a function body.
excessive-nesting-threshold = 4
