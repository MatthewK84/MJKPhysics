[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MatthewK84/MJKPhysics"
authors = ["The MJKPhysics contributors"]
publish = false

[workspace.dependencies]
# Internal crates. Allowed edges between them are enforced by `cargo xtask layering`.
mjk-core = { path = "crates/mjk-core" }
mjk-math = { path = "crates/mjk-math" }
mjk-dynamics = { path = "crates/mjk-dynamics" }
mjk-env = { path = "crates/mjk-env" }
mjk-aero = { path = "crates/mjk-aero" }
mjk-contact = { path = "crates/mjk-contact" }
mjk-control = { path = "crates/mjk-control" }
mjk-sensors = { path = "crates/mjk-sensors" }
mjk-sim = { path = "crates/mjk-sim" }

# Transcendental functions with bit-identical results on every platform (ADR 0001).
libm = "0.2.16"

# Configuration parsing in engine crates (ADR 0006).
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
toml = "1.2.3"

# Tooling only (xtask); engine crates may not depend on this.
serde_json = "1.0.154"

# Test-only dependencies.
proptest = "1.12.0"

# Coding standard: see CONTRIBUTING.md for the rationale behind each rule.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panicking shortcuts outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Numerics: no exact float comparison, no silent `as` casts.
float_cmp = "deny"
float_cmp_const = "deny"
as_conversions = "deny"
# Hygiene.
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
rc_mutex = "deny"
