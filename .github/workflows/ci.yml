# Runs on every pull request, on pushes to main and daily, so a newly published advisory against
# a locked dependency fails within a day. Each job is a separate status check so it can be
# required in branch protection (see CONTRIBUTING.md, "Continuous integration").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *" # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Rust format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  layering:
    name: Crate layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask layering

  standards:
    name: Power of Ten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Recursion, loop bounds, macros, pointers, assertion density
        run: cargo xtask standards

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1
      - name: Advisories, licenses, duplicate versions and sources (deny.toml)
        run: cargo deny --locked check

  spelling:
    name: Spelling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: typos-cli@1.52.2
      - name: Typos and British spellings, in prose and identifiers (typos.toml)
        run: typos

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml) and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-llvm-cov@0.9.2
      - name: Engine line coverage of at least 90 %
        run: |
          cargo llvm-cov --workspace --locked --exclude xtask --exclude mjk-cli --exclude mjk-wasm \
            --summary-only --fail-under-lines 90 | tee "$RUNNER_TEMP/coverage.txt"
      - name: Report coverage in the job summary
        if: always()
        run: |
          {
            echo "### Engine coverage"
            echo
            echo '```'
            cat "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutants:
    name: Mutation testing (changed lines)
    runs-on: ubuntu-24.04
    env:
      # Mutants that only add warnings must still be built and tested, not discarded as unviable.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate the lines this change touches; any survivor fails
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *)
              echo "A $EVENT run has no change to mutate; the weekly deep analysis mutates everything."
              exit 0
              ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base ${base} is not in the history (new branch or force push); using HEAD~1."
            base=$(git rev-parse HEAD~1)
          fi
          git diff "$base" HEAD > "$RUNNER_TEMP/change.diff"
          cargo mutants --workspace --in-diff "$RUNNER_TEMP/change.diff" --no-shuffle -j 2 \
            -o "$RUNNER_TEMP"
      - name: List surviving mutants in the job summary
        if: failure()
        run: |
          {
            echo "### Surviving mutants"
            echo
            echo '```'
            cat "$RUNNER_TEMP/mutants.out/missed.txt" "$RUNNER_TEMP/mutants.out/timeout.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: API docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p mjk-wasm --target wasm32-unknown-unknown --release --locked
      - name: Report size in the job summary
        run: |
          wasm=target/wasm32-unknown-unknown/release/mjk_wasm.wasm
          raw=$(stat -c %s "$wasm")
          gz=$(gzip -9 -c "$wasm" | wc -c)
          {
            echo "### WebAssembly size"
            echo
            echo "| Artifact | Raw (bytes) | gzip -9 (bytes) |"
            echo "|---|---:|---:|"
            echo "| \`mjk_wasm.wasm\` | ${raw} | ${gz} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "mjk_wasm.wasm: ${raw} bytes raw, ${gz} bytes gzip -9"

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in npm dependencies
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Type-check, lint and format-check the README hero and book scripts
        run: |
          npm run typecheck:scripts
          npm run lint:scripts
          npm run format:scripts
      - name: Banned interface patterns (operator-grade-ui, ADR 0007)
        run: npm run lint:ui
